name: Deploy Telegram Serverless bot
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: telegram-serverless
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Configure Jino bridge
        env:
          BRIDGE_SECRET: ${{ secrets.TELEGRAM_SERVERLESS_BRIDGE_SECRET }}
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          if (!process.env.TGCLOUD_TOKEN) throw new Error('Add TGCLOUD_TOKEN to production secrets first');
          const bridgeSecret = process.env.BRIDGE_SECRET || createHash('sha256').update('30-0 bridge:' + process.env.TGCLOUD_TOKEN).digest('hex');
          writeFileSync('tgcloud/lib/config.js', `export const bridgeSecret = ${JSON.stringify(bridgeSecret)};\nexport const bridgeUrl = 'https://30-0.xn--p1ai/api/telegram/serverless';\n`);
          JS
      - name: Fetch deployment state
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: npx tgcloud fetch
      - name: Deploy bot modules and preferences schema
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: |
          npx tgcloud push tgcloud/schema.js tgcloud/handlers/message.js tgcloud/handlers/callback_query.js tgcloud/lib/config.js tgcloud/lib/preferences.js tgcloud/lib/menu.js tgcloud/lib/welcomeImage.js tgcloud/endpoints/preferenceService.js
          npx tgcloud migrate --safe
      - name: Verify native preference storage without messaging users
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import { callCloudPreferences } from './scripts/telegram-cloud-client.mjs';
          const result=await callCloudPreferences('health');
          if(result?.ok!==true)throw new Error('Preference storage check failed');
          console.log('Native notification storage verified');
          JS
      - name: Verify Jino outbound connection to native preference storage
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
          BRIDGE_SECRET: ${{ secrets.TELEGRAM_SERVERLESS_BRIDGE_SECRET }}
        run: |
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          const secret=process.env.BRIDGE_SECRET || createHash('sha256').update('30-0 bridge:'+process.env.TGCLOUD_TOKEN).digest('hex');
          const res=await fetch('https://30-0.xn--p1ai/api/telegram/worker',{headers:{'X-30-0-Worker':secret},signal:AbortSignal.timeout(30000)});
          const result=await res.json().catch(()=>null);
          if(!res.ok||result?.ok!==true)throw new Error('Jino outbound preference check failed: HTTP '+res.status+' '+(/^[a-z0-9_]{1,40}$/.test(result?.reason||'')?result.reason:'unavailable'));
          console.log('Jino can read native Telegram preferences');
          JS
      - name: Sync platform webhook without discarding updates
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if npx tgcloud webhook sync; then
              npx tgcloud webhook
              exit 0
            fi
            sleep 3
          done
          exit 1
