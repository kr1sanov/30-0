name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ─── Stage 1: Quality Gates ───
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ env.NODE_VERSION }}-

      - name: Install dependencies
        run: npm ci

      - name: Switch to MySQL schema
        run: cp prisma/schema.mysql.prisma prisma/schema.prisma

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: ESLint (src only)
        run: npx eslint src/

      - name: TypeScript Check
        run: npx tsc --noEmit

      - name: Authentication and Telegram tests
        run: node --experimental-strip-types --test tests/*.test.ts

      - name: Deployment script syntax
        run: |
          bash -n scripts/deploy-production.sh
          node --check scripts/prepare-production-users.cjs
          node --check scripts/backfill-wingback-positions.mjs
          node --check scripts/backfill-2026-rpl-data.mjs

  # ─── Stage 2: Build ───
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ env.NODE_VERSION }}-

      - name: Install dependencies
        run: npm ci

      - name: Switch to MySQL schema
        run: cp prisma/schema.mysql.prisma prisma/schema.prisma

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js
        env:
          DATABASE_URL: "mysql://dummy:dummy@localhost:3306/dummy"
          NODE_ENV: production
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          # The standalone output contains its server build under the nested
          # hidden directory `.next/standalone/.next`. Without this option the
          # artifact only carries server.js and node_modules, so production
          # starts without BUILD_ID and server chunks.
          include-hidden-files: true
          path: |
            .next/standalone/
            .next/static/
            public/
            prisma/
            package.json
          retention-days: 1

  # ─── Stage 3: Deploy (only on push to main) ───
  deploy:
    name: Deploy to Jino
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: build-artifact/

      - name: Create deployment package
        run: |
          # Next.js standalone deployment on Jino (Apache + Phusion Passenger):
          # APP_DIR/app.js                        <- Passenger entrypoint (starts standalone server)
          # APP_DIR/.htaccess                     <- Apache/Passenger config
          # APP_DIR/.next/standalone/             <- the server and its node_modules
          # APP_DIR/.next/standalone/.next/static/ <- static assets (MUST be here)
          # APP_DIR/.next/standalone/public/      <- public files (served by Next.js)
          # APP_DIR/.next/standalone/.next/server/ <- server chunks
          # APP_DIR/prisma/                       <- Prisma schema

          mkdir -p deploy-package/.next/standalone
          mkdir -p deploy-package/prisma

          # Copy the full standalone directory (includes server.js, node_modules, .next/)
          cp -r build-artifact/.next/standalone/. deploy-package/.next/standalone/

          # Copy static assets into standalone/.next/static/ (Next.js requires this)
          mkdir -p deploy-package/.next/standalone/.next/static
          cp -r build-artifact/.next/static/. deploy-package/.next/standalone/.next/static/

          # Copy public files into standalone/public/ (Next.js requires this for serving)
          mkdir -p deploy-package/.next/standalone/public
          cp -r build-artifact/public/. deploy-package/.next/standalone/public/ 2>/dev/null || true

          # Copy Prisma schema
          cp -r build-artifact/prisma/. deploy-package/prisma/

          # Copy the idempotent production data preflight used before db push
          mkdir -p deploy-package/scripts
          cp scripts/prepare-production-users.cjs deploy-package/scripts/
          cp scripts/deploy-production.sh deploy-package/scripts/
          cp scripts/backfill-wingback-positions.mjs deploy-package/scripts/
          cp scripts/backfill-2026-rpl-data.mjs deploy-package/scripts/

          # Copy package.json for reference
          cp build-artifact/package.json deploy-package/

          # Copy Passenger entrypoint (app.js) to domain root
          cp app.js deploy-package/app.js

          # Copy .htaccess from the checked-out repository. upload-artifact excludes
          # hidden files by default, so it is intentionally not read from the build artifact.
          cp public/.htaccess deploy-package/.htaccess

          # Verify structure
          echo "Deploy package structure:"
          ls -la deploy-package/
          echo "---"
          ls -la deploy-package/.next/standalone/ | head -10
          echo "---"
          ls -la deploy-package/.next/standalone/.next/ 2>/dev/null | head -5
          echo "---"
          echo "app.js exists: $(test -f deploy-package/app.js && echo YES || echo NO)"
          echo ".htaccess exists: $(test -f deploy-package/.htaccess && echo YES || echo NO)"
          echo "Static files count: $(find deploy-package/.next/standalone/.next/static/ -type f 2>/dev/null | wc -l)"

          # Create tarball
          cd deploy-package && tar -czf ../deploy.tar.gz . && cd ..
          echo "Package size: $(du -sh deploy.tar.gz)"

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.JINO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Upload and deploy over one SSH connection
        run: |
          # Jino intermittently throttles consecutive SSH connections. Stream
          # the archive and execute the bundled deploy script in one session.
          ssh \
            -i ~/.ssh/deploy_key \
            -p "${{ secrets.JINO_SSH_PORT }}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=180 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "${{ secrets.JINO_USERNAME }}@${{ secrets.JINO_HOST }}" \
            "set -euo pipefail; cat > /tmp/deploy.tar.gz; tar -xOf /tmp/deploy.tar.gz ./scripts/deploy-production.sh > /tmp/deploy-production.sh; chmod +x /tmp/deploy-production.sh; export APP_DIR='${{ secrets.JINO_APP_DIR }}'; bash /tmp/deploy-production.sh" \
            < deploy.tar.gz

  # ─── Stage 4: Post-Deploy Verification ───
  # scripts/deploy-production.sh blocks until /api/health reports status=ok
  # and rolls back the release on failure. Keep verification in the same SSH
  # session because Jino throttles consecutive connections from GitHub runners.
  verify:
    name: Verify Production
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Confirm deployment health gate
        run: |
          echo "Deployment completed only after the production health check passed."
          echo "The deploy script would have rolled back and failed otherwise."

      - name: Pipeline Summary
        run: |
          echo "## CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Type Check | Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy + Health Check | Passed |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
